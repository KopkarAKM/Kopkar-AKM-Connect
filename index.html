<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Koperasi Adaro Karya Mandiri</title>
  
  <meta name="theme-color" content="#0052CC">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kopkar AKM">
  <link rel="apple-touch-icon" href="https://i.ibb.co.com/WvTwLMn5/image-1.png">

  <script>
    const manifestData = {
      "name": "Portal Koperasi Adaro Karya Mandiri",
      "short_name": "Kopkar AKM",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#f8faff",
      "theme_color": "#0052CC",
      "icons": [
        { "src": "https://i.ibb.co.com/WvTwLMn5/image-1.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
        { "src": "https://i.ibb.co.com/WvTwLMn5/image-1.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
      ]
    };
    const manifestUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData));
    document.write('<link rel="manifest" href="' + manifestUrl + '">');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8faff; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .font-poppins { font-family: 'Poppins', sans-serif; }
    
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    
    /* Animation Utilities */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideDownFade {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .animate-slide-up { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-toast { animation: slideDownFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Poppins', 'sans-serif'],
          },
          colors: {
            "primary": "#0052CC",
            "primary-dark": "#004eb8",
            "primary-light": "#e3f2fd",
            "secondary": "#00b870",
            "secondary-dark": "#05a655",
            "secondary-light": "#e8f5e9",
            "background": "#f8faff",
            "surface": "#ffffff",
            "text-main": "#1a1a1a",
            "text-muted": "#6b7280",
            "error": "#ef4444",
            "error-light": "#fef2f2",
            "warning": "#f97316",
            "warning-light": "#fff7ed",
          },
          boxShadow: {
            'glow-primary': '0 0 0 4px rgba(0, 82, 204, 0.15)',
            'glow-secondary': '0 0 0 4px rgba(0, 184, 112, 0.15)',
            'glow-error': '0 0 0 4px rgba(239, 68, 68, 0.15)',
            'card': '0 4px 12px rgba(0,0,0,0.05)',
            'card-hover': '0 8px 24px rgba(0,0,0,0.08)',
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef } = React;

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxBMZ6lVxo7H3B5aRaMO26OoiCGNzbZWXIaQ6fXypq8T25kl_2g-hgtSzy33tutXGJ5/exec"; 

    // Helper safely converting Google Drive image URLs to raw view links
    const getSafeImageUrl = (url) => {
      if (!url) return '';
      const idMatch = url.match(/id=([^&]+)/);
      if (idMatch) return 'https://lh3.googleusercontent.com/d/' + idMatch[1];
      return url;
    };

    // Global Toast Notification Component
    const Toast = ({ message, type }) => {
      if (!message) return null;
      
      const config = {
        success: { bg: 'bg-secondary', icon: 'check_circle', text: 'text-white' },
        error: { bg: 'bg-error', icon: 'error', text: 'text-white' },
        warning: { bg: 'bg-warning', icon: 'warning', text: 'text-white' },
        info: { bg: 'bg-primary', icon: 'info', text: 'text-white' }
      };
      
      const current = config[type] || config.info;

      return (
        <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 px-5 py-3 rounded-2xl shadow-xl z-[999] flex items-center gap-3 animate-toast w-[90%] max-w-[400px] ${current.bg} ${current.text}`}>
          <span className="material-symbols-outlined text-[24px]">{current.icon}</span>
          <span className="font-sans text-sm font-medium leading-tight">{message}</span>
        </div>
      );
    };

    // Bottom Navigation Component
    const BottomNav = ({ activeTab, onNavigate }) => {
      const tabs = [
        { id: 'home', icon: 'home', label: 'Beranda' },
        { id: 'services', icon: 'apps', label: 'Layanan' },
        { id: 'profile', icon: 'person', label: 'Profil' }
      ];

      return (
        <nav className="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe pt-2 bg-surface border-t border-gray-100 shadow-[0_-4px_16px_rgba(0,0,0,0.03)]">
          {tabs.map((tab) => (
            <button 
              key={tab.id} 
              onClick={() => onNavigate(tab.id === 'home' ? 'dashboard' : tab.id === 'profile' ? 'edit-profile' : tab.id)} 
              className={`flex flex-col items-center justify-center px-4 py-2 w-full active:scale-95 transition-transform duration-150 ${activeTab === tab.id ? 'text-primary' : 'text-text-muted'}`}
            >
              <div className={`px-5 py-1.5 rounded-full transition-colors ${activeTab === tab.id ? 'bg-primary-light/50' : 'bg-transparent'}`}>
                <span className="material-symbols-outlined text-[26px]" style={activeTab === tab.id ? {fontVariationSettings: "'FILL' 1"} : {}}>{tab.icon}</span>
              </div>
              <span className={`text-[11px] mt-1 font-sans ${activeTab === tab.id ? 'font-semibold text-primary' : 'font-medium'}`}>{tab.label}</span>
            </button>
          ))}
          {/* Settings Tab (Placeholder) */}
          <button className="flex flex-col items-center justify-center px-4 py-2 w-full text-text-muted active:scale-95 transition-transform duration-150">
            <div className="px-5 py-1.5 rounded-full bg-transparent">
              <span className="material-symbols-outlined text-[26px]">settings</span>
            </div>
            <span className="text-[11px] mt-1 font-sans font-medium">Pengaturan</span>
          </button>
        </nav>
      );
    };

    const LoginScreen = ({ onLoginSuccess, showToast }) => {
      const [nama, setNama] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [isLoading, setIsLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!nama || !password) {
           showToast('Mohon isi nama pengguna dan kata sandi.', 'warning');
           return;
        }
        
        setIsLoading(true);

        try {
          if (nama.toLowerCase().trim() === 'admin' && password.trim() === 'admin') {
            setTimeout(() => {
                showToast('Masuk mode simulasi berhasil.', 'success');
                onLoginSuccess({ Nama: 'Admin Uji Coba', NoAnggota: '12345', TempatTanggalLahir: 'Jakarta, 1 Jan 1990', Site: 'KM 73' });
            }, 800);
            return;
          }

          const response = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'login', nama, password })
          });
          
          const result = await response.json();
          
          if (result.status === 'success') {
            showToast(`Selamat datang kembali, ${result.data.Nama.split(' ')[0]}!`, 'success');
            onLoginSuccess(result.data);
          } else {
            showToast(result.message || 'Nama atau No Anggota salah.', 'error');
          }
        } catch (err) {
          showToast('Koneksi gagal. Periksa jaringan Anda.', 'error');
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-center items-center px-6 w-full bg-background animate-slide-up">
          <main className="w-full max-w-[400px] flex flex-col gap-8 z-10">
            
            {/* Header Branding */}
            <header className="flex flex-col items-center text-center">
              <div className="w-28 h-28 flex items-center justify-center mb-6 bg-surface shadow-card rounded-full p-2 border border-gray-100">
                <img src="https://i.ibb.co.com/WvTwLMn5/image-1.png" alt="Logo" className="w-full h-full object-contain" />
              </div>
              <h1 className="text-3xl font-display font-bold text-text-main mb-2 tracking-tight">Portal Koperasi AKM</h1>
              <p className="text-sm font-sans text-text-muted">Kelola data keanggotaan dan akses layanan finansial dengan mudah & aman.</p>
            </header>

            {/* Login Card */}
            <section className="bg-surface rounded-3xl shadow-card p-6 border border-gray-100">
              <form className="flex flex-col gap-5" onSubmit={handleLogin}>
                
                {/* Username Input */}
                <div className="flex flex-col gap-1.5">
                  <label className="text-[13px] font-sans font-semibold text-text-main">Nama Pengguna</label>
                  <div className="relative flex items-center group">
                    <span className="material-symbols-outlined absolute left-3.5 text-text-muted group-focus-within:text-primary transition-colors text-[22px]">person</span>
                    <input 
                      value={nama} 
                      onChange={(e)=>setNama(e.target.value)} 
                      className="w-full h-12 pl-11 pr-4 bg-background rounded-xl border border-gray-200 text-text-main text-sm font-sans focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none" 
                      placeholder="e.g. agus_santoso" 
                      required 
                      type="text" 
                    />
                  </div>
                </div>

                {/* Password Input */}
                <div className="flex flex-col gap-1.5">
                  <div className="flex justify-between items-center">
                    <label className="text-[13px] font-sans font-semibold text-text-main">Kata Sandi</label>
                  </div>
                  <div className="relative flex items-center group">
                    <span className="material-symbols-outlined absolute left-3.5 text-text-muted group-focus-within:text-primary transition-colors text-[22px]">lock</span>
                    <input 
                      value={password} 
                      onChange={(e)=>setPassword(e.target.value)} 
                      className="w-full h-12 pl-11 pr-12 bg-background rounded-xl border border-gray-200 text-text-main text-sm font-sans focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none" 
                      placeholder="Masukkan No. Anggota" 
                      required 
                      type={showPassword ? "text" : "password"} 
                    />
                    <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3.5 text-text-muted active:scale-95 transition-transform p-1 flex items-center justify-center">
                        <span className="material-symbols-outlined text-[20px]">{showPassword ? 'visibility_off' : 'visibility'}</span>
                    </button>
                  </div>
                </div>

                {/* Helper Banner */}
                <div className="bg-primary-light/40 border border-primary-light p-3.5 rounded-xl flex items-start gap-3 mt-1">
                  <span className="material-symbols-outlined text-primary text-[20px] shrink-0">info</span>
                  <p className="text-[12px] font-sans leading-relaxed text-text-main">
                    Gunakan <strong>Nama</strong> dan <strong>No Anggota</strong> sesuai data pusat. (Ketik "admin" untuk uji coba).
                  </p>
                </div>

                {/* Submit Button */}
                <button disabled={isLoading} className={`w-full h-12 mt-2 bg-primary text-white font-display font-semibold text-sm rounded-xl shadow-[0_4px_12px_rgba(0,82,204,0.25)] active:scale-95 active:shadow-inner transition-all flex items-center justify-center gap-2 ${isLoading ? 'opacity-80' : ''}`} type="submit">
                  {isLoading ? (
                      <><span className="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> Memproses...</>
                  ) : (
                      <><span className="material-symbols-outlined text-[20px]">login</span> Masuk ke Portal</>
                  )}
                </button>
              </form>
            </section>
            
            <footer className="text-center mt-2">
                <p className="text-[13px] font-sans text-text-muted">Kendala login? <a href="#" className="font-semibold text-primary">Hubungi Admin</a></p>
            </footer>
          </main>
        </div>
      );
    };

    const DashboardScreen = ({ onNavigate, userData }) => {
      return (
        <div className="bg-background min-h-screen flex flex-col w-full pb-24 animate-slide-up">
          
          {/* Header Klasik Sesuai Gambar */}
          <header className="flex items-center gap-3 w-full px-5 py-3 sticky top-0 z-50 bg-surface border-b border-gray-200">
            <div className="w-10 h-10 rounded-full bg-[#001e40] flex items-center justify-center shrink-0">
              <span className="material-symbols-outlined text-white text-[24px]">person</span>
            </div>
            <div className="flex flex-col">
              <h1 className="text-[16px] font-bold text-[#001e40] font-display leading-tight">Adaro Karya Mandiri</h1>
              <p className="text-[13px] font-sans text-text-muted mt-0.5">Halo, {userData?.Nama ? userData.Nama.split(' ')[0] : 'Anggota'}</p>
            </div>
          </header>

          <main className="flex-grow px-5 pt-6 max-w-screen-xl mx-auto w-full flex flex-col items-center gap-8">
            
            {/* ID Card dengan Background Motif Sesuai Gambar */}
            <section 
              className="rounded-[20px] text-white shadow-xl relative overflow-hidden bg-cover bg-top flex flex-col items-center w-full max-w-[320px] aspect-[2/3.1]"
              style={{ backgroundImage: "url('https://i.ibb.co.com/8LnVP8vp/1.png')" }}
            >
              {/* Gradient overlay agar teks di bawah tetap terbaca */}
              <div className="absolute inset-0 bg-gradient-to-b from-transparent via-[#001e40]/60 to-[#001e40]/95 z-0"></div>

              {/* Area Foto Profil */}
              <div className="relative z-10 w-[110px] h-[110px] mt-[145px] bg-white rounded-full overflow-hidden shrink-0 flex items-center justify-center shadow-lg">
                {userData?.Foto ? (
                  <img src={getSafeImageUrl(userData.Foto)} alt="Foto Profil" className="w-full h-full object-cover" referrerPolicy="no-referrer" />
                ) : (
                  <span className="material-symbols-outlined text-[60px] text-gray-500">person</span>
                )}
              </div>

              {/* Data Karyawan */}
              <div className="mt-auto relative z-10 flex flex-col w-full px-5 pb-6 text-center">
                <div className="mb-3">
                  <h3 className="font-display font-bold text-[10px] tracking-widest text-[#8bf6a1] uppercase mb-1 drop-shadow-md">KOPERASI KARYAWAN</h3>
                  <h2 className="font-display font-bold text-[18px] leading-tight drop-shadow-md">Adaro Karya Mandiri</h2>
                </div>

                <div className="mb-3">
                  <p className="text-[10px] font-sans font-bold text-[#a7c8ff] uppercase tracking-wider mb-1 drop-shadow-md">NAMA LENGKAP</p>
                  <p className="font-display font-bold text-xl leading-tight truncate drop-shadow-md">{userData?.Nama || 'Nama Belum Diisi'}</p>
                </div>
                
                {/* Garis Pemisah */}
                <div className="w-full h-[1px] bg-white/20 my-2"></div>
                
                <div className="flex justify-between gap-2">
                  <div className="flex-1 text-center">
                    <p className="text-[10px] font-sans font-bold text-[#a7c8ff] uppercase tracking-wider mb-1 drop-shadow-md">NO. ANGGOTA</p>
                    <p className="font-display font-bold text-[15px] drop-shadow-md">{userData?.NoAnggota || '-'}</p>
                  </div>
                  <div className="w-[1px] bg-white/20"></div>
                  <div className="flex-1 text-center">
                    <p className="text-[10px] font-sans font-bold text-[#a7c8ff] uppercase tracking-wider mb-1 drop-shadow-md">SITE</p>
                    <p className="font-display font-bold text-[15px] drop-shadow-md">{userData?.Site || '-'}</p>
                  </div>
                </div>
              </div>
            </section>

            {/* Quick Actions (2 Tombol sesuai layout asli) */}
            <div className="grid grid-cols-2 gap-4 w-full max-w-[320px]">
              
              {/* Tombol Update Profil */}
              <button onClick={() => onNavigate('edit-profile')} className="flex flex-col items-center justify-center gap-3 p-4 bg-white rounded-[16px] border border-gray-200 shadow-[0_4px_12px_rgba(0,0,0,0.05)] active:scale-95 transition-transform">
                <div className="w-[50px] h-[50px] rounded-full bg-[#eef2ff] flex items-center justify-center text-[#001e40]">
                  <span className="material-symbols-outlined text-[26px]">edit_square</span>
                </div>
                <span className="text-[14px] font-display font-bold text-[#001e40]">Update Profil</span>
              </button>
              
              {/* Tombol Layanan */}
              <button onClick={() => onNavigate('services')} className="flex flex-col items-center justify-center gap-3 p-4 bg-[#8bf6a1] rounded-[16px] shadow-[0_4px_12px_rgba(139,246,161,0.3)] active:scale-95 transition-transform">
                <div className="w-[50px] h-[50px] rounded-full bg-[#007234]/15 flex items-center justify-center text-[#007234]">
                  <span className="material-symbols-outlined text-[26px]">apps</span>
                </div>
                <span className="text-[14px] font-display font-bold text-[#007234]">Layanan</span>
              </button>

            </div>
          </main>
          <BottomNav activeTab="home" onNavigate={onNavigate} />
        </div>
      );
    };

    const ServicesScreen = ({ onNavigate }) => {
      const servicesFinansial = [
        { id: 1, title: 'Pinjaman Konsumtif', desc: 'Pinjam dana dengan bunga terjangkau & cicilan fleksibel.', icon: 'payments', url: 'https://kopkarakm.github.io/Pinjaman-Konsumtif/', active: true },
        { id: 2, title: 'Penarikan Sukarela', desc: 'Tarik dana simpanan sukarela Anda kapan saja dengan mudah.', icon: 'volunteer_activism', url: 'https://kopkarakm.github.io/Penarikan-Sukarela-/', active: true },
        { id: 3, title: 'Tabungan Berjangka', desc: 'Simpanan sukarela dan berjangka untuk masa depan.', icon: 'account_balance_wallet', url: 'https://kopkarakm.github.io/Tabungan-Sukarela/', active: true },
      ];

      const servicesLainnya = [
        { id: 4, title: 'Tour & Travel', desc: 'Pemesanan tiket penerbangan dan paket wisata Kopkarindo.', icon: 'flight_takeoff', url: 'https://kopkarakm.github.io/Kopkarindo-Travel/', active: true },
        { id: 5, title: 'Website Kopkar AKM', desc: 'Platform informasi lengkap seputar regulasi koperasi.', icon: 'language', url: '', active: false }
      ];

      const ServiceCard = ({ srv }) => (
        <div className={`bg-surface border ${srv.active ? 'border-gray-100 shadow-card' : 'border-gray-200 shadow-none'} p-4 rounded-2xl flex flex-col h-full relative overflow-hidden`}>
          <div className="flex items-start gap-4 mb-4 z-10">
            <div className={`w-12 h-12 shrink-0 rounded-full flex items-center justify-center shadow-sm ${srv.active ? 'bg-gradient-to-br from-primary-light to-white text-primary border border-primary-light' : 'bg-gray-100 text-gray-400'}`}>
              <span className="material-symbols-outlined text-[26px]">{srv.icon}</span>
            </div>
            <div>
              <h4 className={`font-display font-semibold text-[15px] leading-snug mb-1 ${srv.active ? 'text-text-main' : 'text-gray-500'}`}>{srv.title}</h4>
              <p className="text-[12px] font-sans text-text-muted leading-relaxed">{srv.desc}</p>
            </div>
          </div>
          <div className="mt-auto pt-4 border-t border-gray-100 z-10">
            {srv.active ? (
              <a href={srv.url} target="_blank" rel="noopener noreferrer" className="w-full h-11 rounded-xl bg-transparent border-2 border-primary text-primary font-sans font-semibold text-[13px] flex items-center justify-center gap-2 active:bg-primary-light transition-colors">
                Buka Layanan <span className="material-symbols-outlined text-[18px]">arrow_forward</span>
              </a>
            ) : (
              <button disabled className="w-full h-11 rounded-xl bg-gray-100 text-gray-400 font-sans font-semibold text-[13px] flex items-center justify-center gap-2">
                <span className="material-symbols-outlined text-[18px]">lock</span> Segera Hadir (Q4)
              </button>
            )}
          </div>
        </div>
      );

      return (
        <div className="bg-background min-h-screen pb-28 w-full animate-slide-up">
          <header className="bg-surface border-b border-gray-200 flex items-center justify-center w-full px-5 py-4 sticky top-0 z-40">
            <h1 className="text-[18px] font-display font-bold text-text-main">Layanan Koperasi</h1>
          </header>
          
          <main className="max-w-xl mx-auto px-5 pt-6 flex flex-col gap-8">
            <section>
              <div className="flex items-center gap-3 mb-4">
                <div className="w-1 h-6 bg-secondary rounded-full"></div>
                <h2 className="text-[15px] font-display font-bold text-text-main uppercase tracking-wide">Kategori Finansial</h2>
              </div>
              <div className="flex flex-col gap-4">
                {servicesFinansial.map(srv => <ServiceCard key={srv.id} srv={srv} />)}
              </div>
            </section>

            <section>
              <div className="flex items-center gap-3 mb-4">
                <div className="w-1 h-6 bg-primary rounded-full"></div>
                <h2 className="text-[15px] font-display font-bold text-text-main uppercase tracking-wide">Layanan Lainnya</h2>
              </div>
              <div className="flex flex-col gap-4">
                {servicesLainnya.map(srv => <ServiceCard key={srv.id} srv={srv} />)}
              </div>
            </section>
          </main>
          <BottomNav activeTab="services" onNavigate={onNavigate} />
        </div>
      );
    };

    const InputField = ({ label, icon, ...props }) => (
      <div className="flex flex-col gap-1.5">
          <label className="text-[13px] font-sans font-semibold text-text-main">{label}</label>
          <div className="relative flex items-center group">
              {icon && <span className="material-symbols-outlined absolute left-3.5 text-text-muted group-focus-within:text-primary transition-colors text-[20px]">{icon}</span>}
              <input 
                  {...props} 
                  className={`w-full h-12 ${icon ? 'pl-11' : 'pl-4'} pr-4 bg-background rounded-xl border border-gray-200 text-text-main text-[14px] font-sans focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none`} 
              />
          </div>
      </div>
    );

    const FileUploadBox = ({ label, icon, onUpload, currentUrl, isUploading, uploadMsg }) => {
      const fileInputRef = useRef(null);
      return (
          <div className="flex flex-col gap-1.5">
              <label className="text-[13px] font-sans font-semibold text-text-main">{label}</label>
              <div 
                  className={`border-2 border-dashed ${isUploading ? 'border-primary bg-primary-light/50' : 'border-primary/30 bg-surface active:bg-primary-light/30'} rounded-2xl p-3 flex flex-col items-center justify-center cursor-pointer transition-colors relative overflow-hidden min-h-[140px]`}
                  onClick={() => !isUploading && fileInputRef.current.click()}
              >
                  {isUploading ? (
                      <div className="flex flex-col items-center gap-3 text-primary p-4">
                          <span className="material-symbols-outlined animate-spin text-[32px]">progress_activity</span>
                          <span className="text-[13px] font-sans font-semibold text-center">{uploadMsg || 'Mengunggah...'}</span>
                      </div>
                  ) : currentUrl ? (
                      <div className="relative w-full h-32 flex items-center justify-center group bg-black/5 rounded-xl overflow-hidden">
                          <img src={currentUrl} className="max-h-full max-w-full object-contain" alt="Preview" referrerPolicy="no-referrer" />
                          <div className="absolute bottom-2 right-2 flex flex-col items-center justify-center">
                              <span className="text-primary text-[11px] font-sans font-bold flex items-center gap-1 bg-white px-3 py-1.5 rounded-lg shadow-md border border-gray-100">
                                  <span className="material-symbols-outlined text-[16px]">edit</span> Ganti
                              </span>
                          </div>
                      </div>
                  ) : (
                      <div className="flex flex-col items-center gap-2 text-center p-4">
                          <div className="w-12 h-12 rounded-full bg-primary-light/50 flex items-center justify-center text-primary mb-1">
                              <span className="material-symbols-outlined text-[26px]">{icon || 'add_photo_alternate'}</span>
                          </div>
                          <span className="text-[13px] font-sans font-semibold text-text-main">Ketuk area ini untuk memilih foto</span>
                          <span className="text-[11px] font-sans font-medium text-text-muted">Format: JPG/PNG • Maks. 5MB</span>
                      </div>
                  )}
              </div>
              <input type="file" ref={fileInputRef} className="hidden" accept="image/png, image/jpeg, image/webp" onChange={onUpload} />
          </div>
      );
    };

    const PasswordModal = ({ isOpen, onClose, userData, showToast }) => {
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      
      if (!isOpen) return null;

      const handleSubmit = async (e) => {
          e.preventDefault();
          if (newPassword !== confirmPassword) {
              showToast('Kata sandi tidak cocok!', 'error');
              return;
          }
          if (newPassword.length < 5) {
              showToast('Kata sandi minimal 5 karakter.', 'warning');
              return;
          }
          
          setIsLoading(true);
          try {
              if (userData?.Nama === 'Admin Uji Coba') {
                  setTimeout(() => {
                      showToast('Sandi berhasil diubah di mode simulasi.', 'success');
                      setIsLoading(false);
                      onClose();
                  }, 800);
                  return;
              }
              
              const response = await fetch(GAS_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                  body: JSON.stringify({ action: 'changePassword', NoAnggota: userData.NoAnggota, newPassword })
              });
              const result = await response.json();
              if (result.status === 'success') {
                  showToast('Kata sandi berhasil diperbarui.', 'success');
                  onClose();
              } else {
                  showToast(result.message || 'Gagal mengubah sandi', 'error');
              }
          } catch (err) {
              showToast('Kesalahan jaringan. Coba lagi.', 'error');
          } finally {
              setIsLoading(false);
          }
      };

      return (
          <div className="fixed inset-0 z-[100] flex items-center justify-center p-5 bg-black/50 backdrop-blur-sm animate-slide-up">
              <div className="bg-surface rounded-3xl w-full max-w-[360px] shadow-2xl overflow-hidden flex flex-col">
                  <div className="p-5 border-b border-gray-100 flex justify-between items-center">
                      <h3 className="font-display font-bold text-[18px] text-text-main flex items-center gap-2">
                          <span className="material-symbols-outlined text-primary">lock_reset</span>
                          Ubah Kata Sandi
                      </h3>
                      <button onClick={onClose} className="text-text-muted active:bg-gray-100 p-2 rounded-full transition-colors flex items-center justify-center">
                          <span className="material-symbols-outlined text-[20px]">close</span>
                      </button>
                  </div>
                  <form onSubmit={handleSubmit} className="p-6 flex flex-col gap-5">
                      <div className="flex flex-col gap-1.5">
                          <label className="text-[13px] font-sans font-semibold text-text-main">Kata Sandi Baru</label>
                          <input 
                              type="password" 
                              value={newPassword} 
                              onChange={(e) => setNewPassword(e.target.value)} 
                              className="w-full h-12 px-4 bg-background rounded-xl border border-gray-200 text-text-main text-sm focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none" 
                              required 
                              placeholder="Ketik sandi baru Anda"
                          />
                      </div>
                      <div className="flex flex-col gap-1.5">
                          <label className="text-[13px] font-sans font-semibold text-text-main">Konfirmasi Sandi Baru</label>
                          <input 
                              type="password" 
                              value={confirmPassword} 
                              onChange={(e) => setConfirmPassword(e.target.value)} 
                              className={`w-full h-12 px-4 bg-background rounded-xl border ${confirmPassword && newPassword !== confirmPassword ? 'border-error focus:ring-error/20' : 'border-gray-200 focus:border-primary focus:ring-primary/10'} text-text-main text-sm transition-all outline-none`}
                              required 
                              placeholder="Ulangi sandi baru"
                          />
                          {confirmPassword && newPassword !== confirmPassword && (
                              <span className="text-[11px] font-sans font-medium text-error flex items-center gap-1 mt-1">
                                  <span className="material-symbols-outlined text-[14px]">warning</span> Sandi tidak cocok
                              </span>
                          )}
                      </div>
                      <div className="mt-4 flex gap-3">
                          <button type="button" onClick={onClose} className="flex-1 h-12 rounded-xl font-sans font-semibold text-text-main bg-gray-100 active:bg-gray-200 transition-colors">Batal</button>
                          <button type="submit" disabled={isLoading} className="flex-1 h-12 rounded-xl font-sans font-semibold text-white bg-primary active:bg-primary-dark transition-colors flex items-center justify-center shadow-card">
                              {isLoading ? <span className="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> : 'Simpan'}
                          </button>
                      </div>
                  </form>
              </div>
          </div>
      );
    }

    const EditProfileScreen = ({ onNavigate, userData, setUserData, showToast }) => {
      const [formData, setFormData] = useState(userData || {});
      const [isLoading, setIsLoading] = useState(false);
      const [uploadingState, setUploadingState] = useState({ Foto: false, KTP: false });
      const [uploadMsg, setUploadMsg] = useState({ Foto: '', KTP: '' });
      const [isPasswordModalOpen, setIsPasswordModalOpen] = useState(false);

      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

      const handleUpdateData = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          if (formData.Nama === 'Admin Uji Coba') {
            setTimeout(() => {
                setUserData(formData);
                showToast('Profil berhasil disimpan di mode simulasi.', 'success');
                onNavigate('dashboard');
            }, 1000);
            return;
          }

          const response = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'updateProfile', NoAnggota: userData.NoAnggota, userData: formData })
          });
          const result = await response.json();
          if (result.status === 'success') {
            setUserData(formData);
            showToast('Perubahan profil berhasil disimpan.', 'success');
            onNavigate('dashboard');
          } else {
            showToast(result.message || 'Gagal menyimpan profil.', 'error');
          }
        } catch (err) {
          showToast("Gagal terhubung ke server.", 'error');
        } finally {
          setIsLoading(false);
        }
      };

      const handleFileUpload = (e, fileType) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 5 * 1024 * 1024) {
            showToast('Ukuran file terlalu besar. Maksimal 5MB.', 'warning');
            return;
        }

        if (formData.Nama === 'Admin Uji Coba') {
            setUploadingState(prev => ({...prev, [fileType]: true}));
            setTimeout(() => {
                const dummyUrl = "https://i.ibb.co.com/8LnVP8vp/1.png"; 
                setFormData(prev => ({...prev, [fileType]: dummyUrl}));
                setUserData(prev => ({...prev, [fileType]: dummyUrl}));
                setUploadingState(prev => ({...prev, [fileType]: false}));
                showToast(`Simulasi unggah ${fileType} berhasil.`, 'success');
            }, 1500);
            return;
        }

        setUploadingState(prev => ({...prev, [fileType]: true}));
        setUploadMsg(prev => ({...prev, [fileType]: 'Mengoptimalkan foto...'}));
        
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = async () => {
            setUploadMsg(prev => ({...prev, [fileType]: 'Mengunggah...'}));
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            const MAX_HEIGHT = 800;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const base64Compressed = canvas.toDataURL('image/jpeg', 0.7);
            const base64Clean = base64Compressed.split(',')[1];

            try {
              const response = await fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                  action: 'uploadFile',
                  NoAnggota: userData.NoAnggota,
                  fileType: fileType,
                  base64: base64Clean,
                  mimeType: 'image/jpeg',
                  fileName: file.name
                })
              });
              const result = await response.json();
              if (result.status === 'success') {
                setFormData(prev => ({...prev, [fileType]: result.url}));
                setUserData(prev => ({...prev, [fileType]: result.url}));
                showToast(`${fileType} berhasil diperbarui.`, 'success');
              } else {
                showToast(result.message || 'Gagal mengunggah file', 'error');
              }
            } catch (err) {
              showToast(`Gagal mengunggah ${fileType}. Periksa koneksi.`, 'error');
            } finally {
               setUploadingState(prev => ({...prev, [fileType]: false}));
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const SectionHeader = ({ title, subtitle, icon, borderColor }) => (
        <div className="flex items-start gap-3 mb-5 relative">
          <div className={`absolute -left-5 top-0 w-1.5 h-full rounded-r-full ${borderColor}`}></div>
          <div className={`w-10 h-10 rounded-full flex items-center justify-center shrink-0 border ${borderColor.replace('bg-', 'border-').replace('text-', 'border-').replace('/10', '/30')} ${borderColor.replace('bg-', 'text-').replace('/10', '')} bg-surface shadow-sm`}>
            <span className="material-symbols-outlined text-[22px]">{icon}</span>
          </div>
          <div className="pt-0.5">
            <h3 className="font-display font-semibold text-[16px] text-text-main leading-tight">{title}</h3>
            <p className="text-[12px] font-sans text-text-muted mt-0.5">{subtitle}</p>
          </div>
        </div>
      );

      return (
        <div className="bg-background min-h-screen pb-32 w-full animate-slide-up">
          <header className="flex items-center gap-3 w-full px-5 py-4 sticky top-0 z-40 bg-surface/95 backdrop-blur-md border-b border-gray-100 shadow-sm">
            <button onClick={() => onNavigate('dashboard')} className="w-10 h-10 flex items-center justify-center rounded-full active:bg-gray-100 transition-colors text-text-main">
              <span className="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 className="text-[18px] font-display font-bold text-text-main">Edit Profil Saya</h1>
          </header>

          <main className="max-w-xl mx-auto px-5 pt-6 flex flex-col gap-6">
            
            <form className="flex flex-col gap-8" onSubmit={handleUpdateData}>
              
              {/* Section: Data Pribadi */}
              <section className="bg-surface rounded-3xl p-5 shadow-card border border-gray-100">
                <SectionHeader title="Data Pribadi" subtitle="Informasi identitas dan kontak" icon="badge" borderColor="bg-primary/10 text-primary" />
                <div className="flex flex-col gap-4">
                  <InputField label="Nama Sesuai KTP" name="Nama" value={formData.Nama || ''} onChange={handleChange} icon="person" required />
                  
                  <div className="flex flex-col gap-1.5">
                    <label className="text-[13px] font-sans font-semibold text-text-main">Site / Lokasi Kerja</label>
                    <div className="relative flex items-center group">
                      <span className="material-symbols-outlined absolute left-3.5 text-text-muted group-focus-within:text-primary transition-colors text-[20px]">location_on</span>
                      <select name="Site" value={formData.Site || ''} onChange={handleChange} className="w-full h-12 pl-11 pr-10 bg-background rounded-xl border border-gray-200 text-text-main text-[14px] font-sans focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none appearance-none" required>
                        <option value="" disabled>Pilih Site Anda</option>
                        {['KM 73', 'KELANIS', 'DAHAI', 'ANGGOTA LUAR BIASA', 'PT MBK', 'BRO', 'YABN'].map(opt => (
                           <option key={opt} value={opt}>{opt}</option>
                        ))}
                      </select>
                      <span className="material-symbols-outlined absolute right-3.5 text-text-muted pointer-events-none text-[20px]">expand_more</span>
                    </div>
                  </div>

                  <InputField label="Tempat, Tanggal Lahir" name="TempatTanggalLahir" value={formData.TempatTanggalLahir || ''} onChange={handleChange} icon="event" placeholder="e.g. Jakarta, 1 Jan 1990" />
                  <InputField label="No KTP (NIK)" name="NoKTP" value={formData.NoKTP || ''} onChange={handleChange} icon="credit_card" type="number" />
                  <InputField label="NPWP" name="NPWP" value={formData.NPWP || ''} onChange={handleChange} icon="receipt_long" />
                  <InputField label="Alamat Email" name="Email" value={formData.Email || ''} onChange={handleChange} icon="mail" type="email" />
                  <InputField label="No. Handphone (WhatsApp)" name="NoHP" value={formData.NoHP || ''} onChange={handleChange} icon="call" type="tel" />
                  
                  <div className="flex flex-col gap-1.5">
                    <label className="text-[13px] font-sans font-semibold text-text-main">Alamat Domisili</label>
                    <textarea name="Alamat" value={formData.Alamat || ''} onChange={handleChange} rows="3" className="w-full p-3.5 bg-background rounded-xl border border-gray-200 text-text-main text-[14px] font-sans focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none resize-none leading-relaxed" placeholder="Tuliskan alamat lengkap..."></textarea>
                  </div>
                </div>
              </section>

              {/* Section: Data Rekening */}
              <section className="bg-surface rounded-3xl p-5 shadow-card border border-gray-100">
                <SectionHeader title="Data Rekening" subtitle="Untuk keperluan pencairan dana" icon="account_balance" borderColor="bg-secondary/10 text-secondary-dark" />
                <div className="flex flex-col gap-4">
                  <InputField label="Nama Bank" name="NamaBank" value={formData.NamaBank || ''} onChange={handleChange} icon="domain" placeholder="e.g. BCA, Mandiri" />
                  <InputField label="Nomor Rekening" name="NoRekening" value={formData.NoRekening || ''} onChange={handleChange} icon="numbers" type="number" />
                </div>
              </section>

              {/* Section: Dokumen */}
              <section className="bg-surface rounded-3xl p-5 shadow-card border border-gray-100">
                <SectionHeader title="Dokumen Pendukung" subtitle="Upload foto profil & KTP asli" icon="folder_shared" borderColor="bg-primary/10 text-primary" />
                <div className="flex flex-col gap-5">
                  <FileUploadBox 
                      label="Foto Profil Utama" 
                      icon="account_circle"
                      onUpload={(e) => handleFileUpload(e, 'Foto')} 
                      currentUrl={getSafeImageUrl(formData.Foto)} 
                      isUploading={uploadingState.Foto}
                      uploadMsg={uploadMsg.Foto}
                  />
                  <FileUploadBox 
                      label="Foto KTP Asli" 
                      icon="id_card"
                      onUpload={(e) => handleFileUpload(e, 'KTP')} 
                      currentUrl={getSafeImageUrl(formData.KTP)} 
                      isUploading={uploadingState.KTP}
                      uploadMsg={uploadMsg.KTP}
                  />
                </div>
              </section>

              {/* Submit Button (Sticky at bottom, above nav) */}
              <div className="fixed bottom-[72px] left-0 w-full z-30 px-5 py-3 bg-gradient-to-t from-background via-background/90 to-transparent">
                 <button disabled={isLoading} className={`w-full max-w-xl mx-auto h-[52px] bg-gradient-to-r from-primary to-primary-dark text-white rounded-2xl font-display font-semibold text-[15px] shadow-[0_8px_24px_rgba(0,82,204,0.3)] active:scale-95 active:shadow-inner transition-transform flex items-center justify-center gap-2 ${isLoading ? 'opacity-80' : ''}`} type="submit">
                   {isLoading ? (
                       <><span className="material-symbols-outlined animate-spin text-[22px]">progress_activity</span> Menyimpan...</>
                   ) : (
                       <><span className="material-symbols-outlined text-[22px]">save</span> Simpan Perubahan Profil</>
                   )}
                 </button>
              </div>
            </form>

            {/* Change Password Trigger */}
            <div className="mt-2 mb-10 pb-8">
               <button type="button" onClick={() => setIsPasswordModalOpen(true)} className="w-full h-12 bg-surface border-2 border-gray-200 text-text-main rounded-xl font-sans font-semibold text-[14px] active:bg-gray-100 transition-colors flex items-center justify-center gap-2 shadow-sm">
                   <span className="material-symbols-outlined text-primary text-[20px]">key</span> Ubah Kata Sandi Akun
               </button>
               <p className="text-center text-[11px] font-sans text-text-muted mt-3">Pembaruan data dilindungi sistem enkripsi Koperasi AKM.</p>
            </div>
            
          </main>
          
          <BottomNav activeTab="profile" onNavigate={onNavigate} />
          <PasswordModal isOpen={isPasswordModalOpen} onClose={() => setIsPasswordModalOpen(false)} userData={userData} showToast={showToast} />
        </div>
      );
    };

    function App() {
      const [currentScreen, setCurrentScreen] = useState('login');
      const [userData, setUserData] = useState(null);
      const [toastData, setToastData] = useState(null);
      const [toastKey, setToastKey] = useState(0); 

      const showToast = (message, type = 'info') => {
          setToastData({ message, type });
          setToastKey(prev => prev + 1);
          setTimeout(() => setToastData(null), 3500);
      };

      return (
        <div className="w-full flex justify-center bg-gray-100 min-h-screen">
          <div className="w-full max-w-[480px] bg-background relative shadow-2xl overflow-x-hidden flex flex-col mx-auto">
            
            {/* Global Toast Container */}
            {toastData && <Toast key={toastKey} message={toastData.message} type={toastData.type} />}

            {/* Screen Routing */}
            {currentScreen === 'login' && <LoginScreen onLoginSuccess={(data) => { setUserData(data); setCurrentScreen('dashboard'); }} showToast={showToast} />}
            {currentScreen === 'dashboard' && <DashboardScreen userData={userData} onNavigate={setCurrentScreen} />}
            {currentScreen === 'edit-profile' && <EditProfileScreen userData={userData} setUserData={setUserData} onNavigate={setCurrentScreen} showToast={showToast} />}
            {currentScreen === 'services' && <ServicesScreen onNavigate={setCurrentScreen} />}
          
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
